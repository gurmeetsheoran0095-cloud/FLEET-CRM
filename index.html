<!doctype html>
<html lang="hi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Fleet CRM Web</title>
<style>
:root{
  --bg:#f6f7f9; --card:#ffffff; --text:#14181f; --muted:#5c6675; --line:#e3e7ee;
  --accent:#1f6feb; --good:#1a7f4b; --warn:#b86e00; --bad:#c93c37; --flash:#fff3bf;
}
@media (prefers-color-scheme:dark){
  :root{--bg:#0f1318; --card:#171d25; --text:#e8ecf2; --muted:#9aa5b5; --line:#252d38;
        --accent:#5aa2ff; --good:#4cc38a; --warn:#e0a040; --bad:#ef6b66; --flash:#4a3d0a;}
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{background:var(--bg);color:var(--text);font:15px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;min-height:100vh}
.wrap{max-width:980px;margin:0 auto;padding:16px}
.hidden{display:none !important}
h1{font-size:20px;margin:0}
.muted{color:var(--muted)}
.small{font-size:13px}

/* login */
.login{max-width:380px;margin:12vh auto 0;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:22px}
.login h1{margin-bottom:4px}
label{display:block;font-size:13px;color:var(--muted);margin:14px 0 6px}
input[type=email],input[type=password],input[type=date]{
  width:100%;padding:11px 12px;border-radius:10px;border:1px solid var(--line);
  background:var(--bg);color:var(--text);font-size:16px}
button{font:inherit;cursor:pointer}
.btn{width:100%;margin-top:18px;padding:12px;border:0;border-radius:10px;background:var(--accent);color:#fff;font-weight:600}
.btn:disabled{opacity:.6;cursor:default}
.err{color:var(--bad);font-size:13px;margin-top:12px;min-height:18px}
.banner{background:var(--card);border:1px solid var(--bad);color:var(--bad);border-radius:10px;padding:10px 12px;margin-bottom:12px;font-size:13px}

/* header */
.top{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap;margin-bottom:12px}
.who{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.pill{border:1px solid var(--line);background:var(--card);border-radius:999px;padding:4px 10px;font-size:12px;color:var(--muted)}
.dot{display:inline-block;width:8px;height:8px;border-radius:50%;background:var(--muted);margin-right:6px}
.dot.on{background:var(--good)}
.link{background:none;border:0;color:var(--accent);padding:4px 6px}

/* date bar */
.bar{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:14px}
.chip{border:1px solid var(--line);background:var(--card);color:var(--text);border-radius:999px;padding:7px 14px;font-size:14px}
.chip.active{background:var(--accent);border-color:var(--accent);color:#fff}
.bar input[type=date]{width:auto;padding:7px 10px;font-size:14px}

/* cards */
.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}
@media (min-width:640px){.grid{grid-template-columns:repeat(5,1fr)}}
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:12px 14px}
.card .k{font-size:12px;color:var(--muted)}
.card .v{font-size:28px;font-weight:700;margin-top:2px;border-radius:6px;display:inline-block;padding:0 4px;margin-left:-4px}
.c-total .v{color:var(--accent)} .c-good .v{color:var(--good)} .c-warn .v{color:var(--warn)} .c-bad .v{color:var(--bad)}
.flash{animation:fl 1.4s ease-out}
@keyframes fl{0%{background:var(--flash)}100%{background:transparent}}

/* table */
h2{font-size:16px;margin:22px 0 8px}
.tw{overflow-x:auto;background:var(--card);border:1px solid var(--line);border-radius:12px}
table{border-collapse:collapse;width:100%;min-width:520px}
th,td{padding:10px 12px;text-align:right;border-bottom:1px solid var(--line);white-space:nowrap}
th:first-child,td:first-child{text-align:left;position:sticky;left:0;background:var(--card)}
th{font-size:12px;color:var(--muted);font-weight:600}
tr:last-child td{border-bottom:0}
td.f{border-radius:6px}
.empty{padding:18px;text-align:center;color:var(--muted)}
.note{margin-top:14px;color:var(--muted);font-size:12px}
</style>
</head>
<body>
<div class="wrap">

  <!-- LOGIN -->
  <section id="loginView" class="login hidden">
    <h1>Fleet CRM</h1>
    <div class="muted small">Web login</div>
    <div id="cfgBanner" class="banner hidden" style="margin-top:14px"></div>
    <label for="email">Email</label>
    <input id="email" type="email" autocomplete="username" inputmode="email">
    <label for="pass">Password</label>
    <input id="pass" type="password" autocomplete="current-password">
    <button id="loginBtn" class="btn">Login</button>
    <div id="loginErr" class="err" role="alert"></div>
  </section>

  <!-- APP -->
  <section id="appView" class="hidden">
    <div class="top">
      <div>
        <h1 id="title">Dashboard</h1>
        <div class="who small muted"><span id="whoName"></span><span id="whoRole" class="pill"></span>
          <span class="pill"><span id="liveDot" class="dot"></span><span id="liveTxt">Connecting</span></span></div>
      </div>
      <button id="logoutBtn" class="link">Logout</button>
    </div>

    <div class="bar">
      <button class="chip" data-mode="today">Aaj</button>
      <button class="chip" data-mode="yesterday">Kal</button>
      <input id="pickDate" type="date" aria-label="Date chuno">
      <button class="chip" data-mode="all">All time</button>
    </div>

    <div id="cards" class="grid"></div>

    <div id="teamBox" class="hidden">
      <h2>Telecaller-wise</h2>
      <div class="tw"><table>
        <thead><tr><th>Naam</th><th>Calls</th><th>Interested</th><th>Callback</th><th>Not Int.</th><th>Not Attend</th></tr></thead>
        <tbody id="teamBody"></tbody>
      </table></div>
    </div>

    <div id="dataErr" class="err"></div>
    <div class="note">Calls = har lead ki pehli call par gina jata hai (same lead par dobara call se Calls nahi badhta). Numbers live update hote hain, refresh ki zaroorat nahi.</div>
  </section>

</div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import { getAuth, signInWithEmailAndPassword, onAuthStateChanged, signOut }
  from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";
import { getDatabase, ref, onValue, get }
  from "https://www.gstatic.com/firebasejs/10.12.2/firebase-database.js";

/* ====== SIRF YAHAN APNA FIREBASE WEB CONFIG PASTE KARO ====== */
const firebaseConfig = {
  apiKey: "AIzaSyDrxJi3laG_igBGzsSgN7q8Oswp9T7ljwc",
  authDomain: "fleet-crm-c2abe.firebaseapp.com",
  databaseURL: "https://fleet-crm-c2abe-default-rtdb.firebaseio.com",
  projectId: "fleet-crm-c2abe",
  appId: "1:1061986266092:web:965f53cc5015d09655aec9"
};
/* ============================================================ */

const $ = (id) => document.getElementById(id);
const METRICS = [
  ["total_calls", "Total Calls", "c-total"],
  ["interested", "Interested", "c-good"],
  ["callback", "Callback", "c-warn"],
  ["not_interested", "Not Interested", "c-bad"],
  ["not_attend", "Not Attend", ""]
];
const num = (v) => Math.max(0, Number(v) || 0);

const state = { mode: "today", date: null, role: null, profile: null, user: null,
                agentIdx: {}, unsubs: [], prev: {}, agentData: {} };

function show(view) {
  $("loginView").classList.toggle("hidden", view !== "login");
  $("appView").classList.toggle("hidden", view !== "app");
}
function ymd(d) { return d.toLocaleDateString("en-CA"); }  // yyyy-MM-dd (local time)
function dayOffset(n) { const d = new Date(); d.setDate(d.getDate() + n); return ymd(d); }

/* ---------- init ---------- */
let auth, db;
const configMissing = Object.values(firebaseConfig).some((v) => String(v).startsWith("PASTE"));
if (configMissing) {
  show("login");
  $("cfgBanner").textContent = "Firebase config abhi bhara nahi hai. index.html me firebaseConfig me apni web app ki values paste karo.";
  $("cfgBanner").classList.remove("hidden");
  $("loginBtn").disabled = true;
} else {
  const app = initializeApp(firebaseConfig);
  auth = getAuth(app);
  db = getDatabase(app);
  onValue(ref(db, ".info/connected"), (s) => {
    const on = s.val() === true;
    $("liveDot").classList.toggle("on", on);
    $("liveTxt").textContent = on ? "Live" : "Offline";
  });
  onAuthStateChanged(auth, onUser);
}

/* ---------- login ---------- */
$("loginBtn").addEventListener("click", doLogin);
$("pass").addEventListener("keydown", (e) => { if (e.key === "Enter") doLogin(); });
async function doLogin() {
  const email = $("email").value.trim(), pass = $("pass").value;
  $("loginErr").textContent = "";
  if (!email || !pass) { $("loginErr").textContent = "Email aur password dono daalo."; return; }
  $("loginBtn").disabled = true;
  try { await signInWithEmailAndPassword(auth, email, pass); }
  catch (e) {
    const c = e && e.code;
    $("loginErr").textContent =
      (c === "auth/invalid-credential" || c === "auth/wrong-password" || c === "auth/user-not-found" || c === "auth/invalid-email")
        ? "Email ya password galat hai."
        : c === "auth/too-many-requests" ? "Bahut koshish ho gayi, thodi der baad try karo."
        : c === "auth/network-request-failed" ? "Internet check karo."
        : "Login nahi ho paya.";
  } finally { $("loginBtn").disabled = false; $("pass").value = ""; }
}
$("logoutBtn").addEventListener("click", () => signOut(auth));

/* ---------- user + role ---------- */
function roleOf(p) {
  const r = String((p && (p.role || p.position)) || "").toLowerCase();
  if (r.includes("super")) return "super_admin";
  if (r.includes("admin")) return "admin";
  return "agent";
}
async function loadProfile(user) {
  let snap = await get(ref(db, "agents/" + user.uid));
  if (snap.exists()) return snap.val();
  const all = await get(ref(db, "agents"));           // fallback: purane records
  let found = null;
  all.forEach((c) => {
    const v = c.val() || {};
    if (!found && (v.uid === user.uid || (v.email && v.email.toLowerCase() === (user.email || "").toLowerCase()))) found = v;
  });
  return found;
}
async function onUser(user) {
  detach();
  state.user = user; state.prev = {}; state.agentData = {};
  if (!user) { show("login"); return; }
  let profile = null;
  try { profile = await loadProfile(user); } catch (e) { /* neeche handle */ }
  if (!profile) {
    $("loginErr").textContent = "Is account ka profile nahi mila. Admin se contact karo.";
    show("login"); await signOut(auth); return;
  }
  state.profile = profile; state.role = roleOf(profile);
  $("whoName").textContent = profile.name || user.email || "";
  $("whoRole").textContent = state.role === "super_admin" ? "Super Admin" : state.role === "admin" ? "Admin" : "Telecaller";
  $("title").textContent = state.role === "agent" ? "Meri Calls" : "Team Dashboard";
  $("teamBox").classList.toggle("hidden", state.role === "agent");
  show("app");
  setMode("today");
  if (state.role !== "agent") {
    const stop = onValue(ref(db, "agents"), (s) => {
      const idx = {};
      s.forEach((c) => { const v = c.val() || {}; const nm = v.name || c.key;
        [c.key, v.uid, v.employee_id, v.employeeId, v.name].forEach((k) => { if (k) idx[k] = nm; }); });
      state.agentIdx = idx;
      if (state.lastAdmin) renderAdmin(state.lastAdmin);
    });
    state.unsubs.push(stop);
  }
}
function detach() { state.unsubs.forEach((u) => { try { u(); } catch (e) {} }); state.unsubs = []; }
function detachData() { state.unsubs.splice(1); }   // naam wali agents-subscription rakho

/* ---------- date controls ---------- */
document.querySelectorAll(".chip").forEach((b) => b.addEventListener("click", () => setMode(b.dataset.mode)));
$("pickDate").addEventListener("change", (e) => { if (e.target.value) setMode("date", e.target.value); });
function setMode(mode, date) {
  state.mode = mode;
  state.date = mode === "today" ? dayOffset(0) : mode === "yesterday" ? dayOffset(-1) : mode === "date" ? date : null;
  document.querySelectorAll(".chip").forEach((b) => b.classList.toggle("active", b.dataset.mode === mode));
  if (mode !== "date") $("pickDate").value = "";
  state.prev = {};
  subscribe();
}
function basePath() { return state.mode === "all" ? "analytics/all_time" : "analytics/by_date/" + state.date; }

/* ---------- live data ---------- */
function subscribe() {
  if (state.role === "agent") state.unsubs.forEach((u) => { try { u(); } catch (e) {} }), state.unsubs = [];
  else detachData();
  $("dataErr").textContent = "";
  const onErr = () => { $("dataErr").textContent = "Data load nahi ho paya (permission ya internet)."; };
  if (state.role === "agent") {
    const p = state.profile || {};
    const keys = [...new Set([state.user.uid, p.employee_id, p.employeeId].filter(Boolean))];
    state.agentData = {};
    keys.forEach((k) => {
      state.unsubs.push(onValue(ref(db, basePath() + "/agents/" + k), (s) => {
        state.agentData[k] = s.val() || {};
        renderAgent();
      }, onErr));
    });
  } else {
    state.unsubs.push(onValue(ref(db, basePath()), (s) => {
      state.lastAdmin = s.val() || {};
      renderAdmin(state.lastAdmin);
    }, onErr));
  }
}

/* ---------- render ---------- */
function valEl(tag, key, value, cls) {
  const el = document.createElement(tag);
  el.textContent = String(value);
  if (cls) el.className = cls;
  if (state.prev[key] !== undefined && state.prev[key] !== value) el.classList.add("flash");
  state.prev[key] = value;
  return el;
}
function drawCards(totals) {
  const box = $("cards"); box.textContent = "";
  METRICS.forEach(([k, label, cls]) => {
    const c = document.createElement("div"); c.className = "card " + cls;
    const kk = document.createElement("div"); kk.className = "k"; kk.textContent = label;
    c.append(kk, valEl("div", "card_" + k, num(totals[k]), "v"));
    box.append(c);
  });
}
function renderAdmin(data) {
  drawCards(data);
  const groups = {};
  Object.entries(data.agents || {}).forEach(([key, v]) => {
    const name = state.agentIdx[key] || key;
    const g = groups[name] || (groups[name] = { total_calls: 0, interested: 0, callback: 0, not_interested: 0, not_attend: 0 });
    METRICS.forEach(([m]) => { g[m] += num(v && v[m]); });
  });
  const rows = Object.entries(groups).sort((a, b) => b[1].total_calls - a[1].total_calls);
  const body = $("teamBody"); body.textContent = "";
  if (!rows.length) {
    const tr = document.createElement("tr"), td = document.createElement("td");
    td.colSpan = 6; td.className = "empty"; td.textContent = "Is period me abhi koi call nahi.";
    tr.append(td); body.append(tr); return;
  }
  rows.forEach(([name, g]) => {
    const tr = document.createElement("tr");
    const n0 = document.createElement("td"); n0.textContent = name; tr.append(n0);
    METRICS.forEach(([m]) => tr.append(valEl("td", "t_" + name + "_" + m, g[m], "f")));
    body.append(tr);
  });
}
function renderAgent() {
  const sum = { total_calls: 0, interested: 0, callback: 0, not_interested: 0, not_attend: 0 };
  Object.values(state.agentData).forEach((v) => METRICS.forEach(([m]) => { sum[m] += num(v && v[m]); }));
  drawCards(sum);
}

/* raat 12 ke baad "Aaj" apne aap naye din par chala jaye */
setInterval(() => {
  if (state.user && state.mode === "today" && state.date !== dayOffset(0)) setMode("today");
}, 30000);
</script>
</body>
</html>
